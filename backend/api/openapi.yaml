openapi: 3.1.0
info:
  title: Calculator API
  version: 1.0.0
  description: |
    Stateless calculator service. Every calculation is exact decimal arithmetic with 34 significant
    digits, so `0.1 + 0.2` is `0.3`, not `0.30000000000000004`.

    **Numbers are strings.** Send operands as decimal strings (`"12.5"`, `"-3"`, `"1.5E+40"`) and read
    the result as a string. JSON numbers are accepted on input for convenience, but JavaScript turns
    them into doubles before they leave the browser, so strings are the only way to keep every digit.

    **Errors** use RFC 9457 `application/problem+json` with an extra `code` field that never changes,
    so clients can branch on it instead of parsing messages.

    Calculations have no side effects, so retrying a request is always safe.
servers:
  - url: /
tags:
  - name: Calculations
  - name: Health
paths:
  /api/v1/calculations:
    post:
      tags: [Calculations]
      summary: Run a calculation
      operationId: calculate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
            examples:
              add:
                summary: 0.1 + 0.2
                value: { operation: add, operands: ["0.1", "0.2"] }
              divide:
                summary: 1 / 3
                value: { operation: divide, operands: ["1", "3"] }
              power:
                summary: 2 ^ 10
                value: { operation: power, operands: ["2", "10"] }
              sqrt:
                summary: Square root of 2
                value: { operation: sqrt, operands: ["2"] }
              percentage:
                summary: 15% of 200
                value: { operation: percentage, operands: ["15", "200"] }
              jsonNumbers:
                summary: JSON numbers also work
                value: { operation: multiply, operands: [1.5, 4] }
              divisionByZero:
                summary: Division by zero (422)
                value: { operation: divide, operands: ["1", "0"] }
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"
              examples:
                add:
                  value: { operation: add, operands: ["0.1", "0.2"], result: "0.3" }
                divide:
                  value: { operation: divide, operands: ["1", "3"], result: "0.3333333333333333333333333333333333" }
        "400":
          description: The body isn't valid JSON, has unknown fields, or has operands that are neither strings nor numbers
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Bad Request
                status: 400
                code: malformed_request
                detail: 'json: unknown field "operator"'
        "415":
          description: The body isn't sent as `application/json`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unsupported Media Type
                status: 415
                code: unsupported_media_type
                detail: send the body as application/json
        "413":
          description: The body is larger than 4 KB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Request Entity Too Large
                status: 413
                code: request_too_large
                detail: the request body is larger than 4096 bytes
        "422":
          description: The request is well formed but breaks a math or validation rule
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                divisionByZero:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: division_by_zero, detail: "can't divide by zero" }
                negativeSquareRoot:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: negative_square_root, detail: "can't take the square root of a negative number" }
                zeroToNegativePower:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: zero_to_negative_power, detail: "zero can't be raised to a negative power" }
                complexResult:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: complex_result, detail: "a negative number raised to a fractional power isn't a real number" }
                resultTooLarge:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: result_too_large, detail: "the result is too large (over 1E+9999)" }
                resultTooSmall:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: result_too_small, detail: "the result is too small to represent (under 1E-9999)" }
                invalidNumber:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: invalid_number, detail: "second operand: not a valid number" }
                wrongOperandCount:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: wrong_operand_count, detail: "sqrt takes 1 operand(s), got 2" }
                unknownOperation:
                  value: { type: about:blank, title: Unprocessable Entity, status: 422, code: unknown_operation, detail: 'unknown operation "modulo"' }

  /api/v1/operations:
    get:
      tags: [Calculations]
      summary: List the supported operations
      operationId: listOperations
      responses:
        "200":
          description: Supported operations, in display order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationInfo"
              example:
                items:
                  - { name: add, symbol: "+", arity: 2 }
                  - { name: sqrt, symbol: "√", arity: 1 }

  /healthz:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: health
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: [ok]

components:
  schemas:
    OperationName:
      type: string
      enum: [add, subtract, multiply, divide, power, sqrt, percentage]
      description: |
        `percentage` takes `[a, b]` and returns a percent of b, so `["15", "200"]` is `30`.
        `power` with `["0", "0"]` returns `1`.

    DecimalString:
      type: string
      maxLength: 100
      pattern: '^-?(\d+(\.\d+)?|\.\d+)([eE][+-]?\d{1,4})?$'
      description: |
        ASCII decimal number, optional leading minus, optional exponent. At most 34 significant digits
        (more would be silently rounded, so they're rejected), range 1E-9999 to 1E+9999.
      examples: ["12.5", "-3", "1.5E+40"]

    CalculationRequest:
      type: object
      required: [operation, operands]
      additionalProperties: false
      properties:
        operation:
          $ref: "#/components/schemas/OperationName"
        operands:
          type: array
          minItems: 1
          maxItems: 2
          description: Two operands for every operation except `sqrt`, which takes one.
          items:
            oneOf:
              - $ref: "#/components/schemas/DecimalString"
              - type: number

    CalculationResult:
      type: object
      required: [operation, operands, result]
      properties:
        operation:
          $ref: "#/components/schemas/OperationName"
        operands:
          type: array
          description: The operands as they were understood, normalized (`"1.50"` becomes `"1.5"`).
          items:
            $ref: "#/components/schemas/DecimalString"
        result:
          $ref: "#/components/schemas/DecimalString"

    OperationInfo:
      type: object
      required: [name, symbol, arity]
      properties:
        name:
          $ref: "#/components/schemas/OperationName"
        symbol:
          type: string
        arity:
          type: integer
          enum: [1, 2]

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - malformed_request
            - unsupported_media_type
            - request_too_large
            - not_found
            - method_not_allowed
            - internal_error
            - invalid_number
            - wrong_operand_count
            - unknown_operation
            - division_by_zero
            - negative_square_root
            - zero_to_negative_power
            - complex_result
            - result_too_large
            - result_too_small
        detail: { type: string }
